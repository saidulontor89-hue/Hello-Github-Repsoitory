    <style>
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background-color: #f46905;
    position: relative;
    z-index: 10;
}
.nav-links {
    display: flex;
    gap: 25px;
    font-family: sans-serif;
    font-weight: bold;
    background-color: #f46905;
}

.nav-links a {
    text-decoration: none;
    color:#000;
    font-size: 18px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 20px;
    transition: all 0.3s ease;
}
.nav-links a.active,.nav-links a:hover{
    background-color: #fff;
    color: #f46905;
}
